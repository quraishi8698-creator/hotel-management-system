<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hotel Management System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6fa; }
    .navbar { background:#1f2a44; }
    .stat { border-left:5px solid #c9a227; }
    .badge-Luxury { background:#c9a227; } .badge-Premium { background:#4a6fa5; } .badge-Budget { background:#6c757d; }
    .card-hotel:hover { transform:translateY(-3px); box-shadow:0 6px 18px rgba(0,0,0,.12); transition:.2s; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">🏨 Hotel Management System</a>
    <a class="btn btn-warning btn-sm" href="{{ url_for('add') }}">+ Add Hotel</a>
  </div>
</nav>
<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show">{{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
